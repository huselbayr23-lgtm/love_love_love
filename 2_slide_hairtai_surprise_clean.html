<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чамд хэлэх юм байна 💌</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:linear-gradient(135deg,#ffd9e8,#e7d7ff,#d8f5ff);color:#4b2850}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transform:scale(1.05);pointer-events:none;transition:opacity .7s,transform .7s}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto}
.card{width:min(92vw,470px);text-align:center;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:2px solid #fff;border-radius:35px;padding:32px 24px;box-shadow:0 25px 80px #70406b33}
h1{font-size:clamp(28px,8vw,42px);margin:10px 0;color:#54294f}
p{font-size:18px;line-height:1.6}
button{border:0;border-radius:999px;padding:16px 30px;margin-top:20px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff4389,#955cff);box-shadow:0 12px 28px #d34d9555;cursor:pointer}
.tease{font-size:70px;animation:float 2s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
.photo{width:min(75vw,290px);height:min(75vw,290px);object-fit:cover;border-radius:50%;border:8px solid white;box-shadow:0 15px 40px #7b3c8655;animation:photoIn 1s cubic-bezier(.2,1.5,.4,1)}
@keyframes photoIn{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.big{font-size:clamp(39px,11vw,65px);font-weight:1000;line-height:.95;color:#ff286f;text-shadow:0 5px #fff,0 9px 20px #e23b7955;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.love{font-size:20px;font-weight:750;line-height:1.55;margin-top:18px}
.small{font-size:15px;margin-top:12px;opacity:.7}
.heart{position:fixed;z-index:10;pointer-events:none;font-size:28px;animation:rise 2.7s forwards}
@keyframes rise{to{transform:translate(var(--x),-100vh) rotate(360deg) scale(1.5);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
.flash{animation:flash .45s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.dots{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:30}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff8;margin:4px}
.dot.on{background:#ff4c91}
</style>
</head>

function next(){

function burst(){
 const icons=["❤️","💗","💖","💕","💘","✨","🌸","🩷","🥰"];
 for(let i=0;i<90;i++){
  setTimeout(()=>{

   x.style.left=(45+Math.random()*10)+"vw";
   x.style.top=(45+Math.random()*10)+"vh";
   x.style.setProperty("--x",(Math.random()*500-250)+"px");
   x.style.fontSize=(18+Math.random()*28)+"px";
   document.body.appendChild(x);
   setTimeout(()=>x.remove(),2800);
  },i*18);
 }
}
